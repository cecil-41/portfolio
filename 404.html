<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect hack
    // Store the current path in sessionStorage and redirect to the base URL
    // The main index.html will read this and restore the correct URL
    sessionStorage.redirect = location.href;
    location.replace(location.origin + location.pathname.split('/').slice(0, -1).join('/') + '/?p=/' + location.pathname.slice(1).split('/').slice(1).join('/') + location.search);
  </script>
</head>
<body>
</body>
</html>
