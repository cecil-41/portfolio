    <!-- Browser chrome colour. The media pair covers first paint; the script below and
         ThemeProvider then set both to the theme actually in use (dark unless chosen light). -->
    <meta name="theme-color" content="#07090F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <script>
      // Set the theme before first paint to avoid a flash. Dark unless the user chose light.
      (function () {
        var light = false;
        try { light = localStorage.getItem('theme') === 'light'; } catch (e) {}
        var root = document.documentElement;
        root.classList.toggle('dark', !light);
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', light ? '#F7F8FA' : '#07090F');
      })();
    </script>
